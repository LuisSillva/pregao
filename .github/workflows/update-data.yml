name: Atualizar dados

on:
  schedule:
    # Seg a sex, 22:15 UTC (19:15 em Brasília), depois do fechamento da B3
    - cron: "15 22 * * 1-5"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
      - name: Commit dos dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/prices.parquet
          git diff --cached --quiet || git commit -m "Atualiza dados de mercado"
          git push
